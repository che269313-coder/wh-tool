name: Clear stale GitHub Pages deployment

on:
  push:
    paths:
      - ".github/workflows/clear-stale-pages-deployment.yml"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT: b8fb73924cecb1d9c0790a3b46cf353342eb9965
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$STALE_DEPLOYMENT/cancel"
